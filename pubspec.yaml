name: odc_tracker_ai
description: "ODC Tracker AI — Premium iOS-first ODC working hours tracker."
publish_to: 'none'

version: 1.2.0+12

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # ── State Management ────────────────────────────────────────────────────────
  flutter_riverpod: ^2.5.1

  # ── Firebase ────────────────────────────────────────────────────────────────
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.4
  firebase_analytics: ^11.3.3
  firebase_messaging: ^15.1.3
  firebase_crashlytics: ^4.1.3

  # ── Local Storage ───────────────────────────────────────────────────────────
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.3
  shared_preferences: ^2.3.3

  # ── Charts ──────────────────────────────────────────────────────────────────
  fl_chart: ^0.68.0

  # ── Notifications & Alarms ──────────────────────────────────────────────────
  flutter_local_notifications: ^17.1.2
  timezone: ^0.9.4
  permission_handler: ^11.3.1
  just_audio: ^0.9.38
  audioplayers: ^6.0.0

  # ── Date & Time ─────────────────────────────────────────────────────────────
  intl: ^0.19.0
  table_calendar: ^3.1.1

  # ── UI & Animations ─────────────────────────────────────────────────────────
  flutter_animate: ^4.5.0
  animations: ^2.0.11
  shimmer: ^3.0.0

  # ── Apple / iOS Advanced Features ───────────────────────────────────────────
  local_auth: ^2.3.0             # Face ID / Touch ID biometrics
  in_app_review: ^2.0.9          # App Store review prompt
  share_plus: ^10.0.3            # Native iOS share sheet
  url_launcher: ^6.3.0           # Open URLs, mailto, sms
  package_info_plus: ^8.0.0      # App version info
  device_info_plus: ^10.1.0      # Device model detection (iPhone model)

  # ── Utilities ───────────────────────────────────────────────────────────────
  uuid: ^4.4.0
  path: ^1.9.0

  # ── Export ──────────────────────────────────────────────────────────────────
  pdf: ^3.11.0
  printing: ^5.13.1              # Print / share PDF natively

  # ── Icons ───────────────────────────────────────────────────────────────────
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.11

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/animations/
    - assets/lottie/
    - assets/sounds/
