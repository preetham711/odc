<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=Edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ODC Tracker AI — Track your ODC working hours, breaks, and reports.">

  <!-- PWA -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ODC Tracker AI">
  <meta name="theme-color" content="#4F6EF7">

  <!-- Favicon & icons -->
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="manifest" href="manifest.json">

  <title>ODC Tracker AI</title>

  <style>
    /* Prevent white flash while Flutter loads */
    body {
      background-color: #000000;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    /* Loading indicator */
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #000000;
      z-index: 9999;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: #ffffff;
      gap: 20px;
      transition: opacity 0.4s ease;
    }

    #loading.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .loader-icon {
      width: 72px;
      height: 72px;
      background: linear-gradient(135deg, #4F6EF7, #3A56D4);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
    }

    .loader-title {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .loader-subtitle {
      font-size: 14px;
      color: rgba(255,255,255,0.5);
    }

    .spinner {
      width: 24px;
      height: 24px;
      border: 2px solid rgba(79,110,247,0.3);
      border-top-color: #4F6EF7;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <!-- Loading screen shown until Flutter is ready -->
  <div id="loading">
    <div class="loader-icon">⏰</div>
    <div class="loader-title">ODC Tracker AI</div>
    <div class="loader-subtitle">Loading your workspace...</div>
    <div class="spinner"></div>
  </div>

  <script>
    // Hide the loading overlay once Flutter signals it's ready
    window.addEventListener('flutter-first-frame', function() {
      const loader = document.getElementById('loading');
      if (loader) {
        loader.classList.add('hidden');
        setTimeout(() => loader.remove(), 500);
      }
    });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
